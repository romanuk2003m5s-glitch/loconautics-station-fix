plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.0'
group = 'com.roma.kreiatlocofix'
base.archivesName = 'kreiat-locofix'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.230'
    mods {
        kreiat_locofix {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // put loconautics, create and sable jars into libs/
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}
